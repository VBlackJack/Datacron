name: ci

on:
  workflow_call:
    inputs:
      force-full:
        description: Require the complete platform matrix for reusable callers
        type: boolean
        default: true
  push:
    branches: [main, "feature/**", "fix/**", "delivery/**"]
  pull_request:
    branches: [main]

# Read-only by default: no job here writes to the repository, and a push run
# otherwise received the repository's default token scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select validation scope
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - name: Classify exact changed paths
        id: scope
        env:
          FORCE_FULL: ${{ inputs.force-full }}
        run: python scripts/ci_scope.py
      - name: Refuse commits that credit a code assistant
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: src
        run: python scripts/release_preflight.py attribution --base-sha "$BASE_SHA"

  lint-type-test:
    name: Invariant gate (Py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: scope
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # The macOS leg runs without ripgrep: Homebrew cannot pin a formula version,
      # and the ripgrep route is exercised on the two other systems. The regex
      # tests that need the binary skip themselves when it is absent.
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --version 15.2.0 --no-progress -y

      - name: Install project
        run: |
          python -m pip install uv==0.11.3
          uv sync --frozen --extra dev --python "${{ matrix.python-version }}"

      - name: Blocking invariant gate
        run: uv run --python "${{ matrix.python-version }}" --frozen --extra dev python scripts/check_invariants.py

      - name: Require Windows symlink test capability
        if: runner.os == 'Windows'
        run: uv run --frozen python scripts/check_symlink_support.py

      - name: Full regression suite with coverage
        run: uv run --python "${{ matrix.python-version }}" --frozen --extra dev pytest --cov=datacron --cov-report=term-missing

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: No shell scripts to check
        if: hashFiles('scripts/**/*.sh') == ''
        run: echo "No shell scripts found under scripts/."
      - name: Run ShellCheck
        if: hashFiles('scripts/**/*.sh') != ''
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          severity: warning
          scandir: ./scripts
          ignore_paths: ""

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.3

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra build --python 3.12

      - name: Audit dependencies for known CVEs
        run: uv run --python 3.12 --with pip-audit==2.10.1 pip-audit

  # The lock file tests the newest versions; nothing tested the oldest ones the
  # package metadata accepts. Two floors had been below what the code imports:
  # pydantic-settings 2.2 lacks NoDecode, and typer 0.12 crashed on every command.
  lowest-direct:
    name: Declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.11.3

      - name: Install every direct dependency at its declared floor
        run: |
          uv venv --python 3.11 .venv-floors
          uv pip install --python .venv-floors/bin/python --resolution lowest-direct -e ".[dev]"
          uv pip list --python .venv-floors/bin/python

      - name: Smoke-test the command line and the server at the floors
        run: |
          .venv-floors/bin/datacron --help
          .venv-floors/bin/python -c "import datacron.cli, datacron.mcp.server"

      - name: Fast test subset at the floors
        run: >-
          .venv-floors/bin/python -m pytest -q
          tests/unit/test_cli.py tests/unit/test_human_library.py
          tests/unit/core tests/unit/installers tests/unit/mcp/test_resources.py

  quality-gate:
    name: Quality gate
    if: always()
    needs: [scope, lint-type-test, shellcheck, dependency-audit, lowest-direct]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json, os, sys; jobs=json.loads(os.environ["RESULTS"]); sys.exit(0 if all(j["result"] == "success" for j in jobs.values()) else 1)'
