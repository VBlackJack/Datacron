name: Runtime validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install uv==0.11.3
          uv sync --frozen --extra build --extra dev
          choco install innosetup --version 6.7.1 --no-progress -y
      - name: Require symlink capability
        run: uv run --frozen python scripts/check_symlink_support.py
      - name: Build standalone candidate
        run: >-
          uv run --frozen --extra build python -m PyInstaller --noconfirm --onefile
          --name datacron --collect-data datacron --collect-submodules datacron
          --collect-submodules pydantic --hidden-import pydantic_settings
          --hidden-import truststore packaging/datacron_launcher.py
      - name: Build installer
        shell: pwsh
        run: |
          $candidateVersion = uv run --frozen python -c "from datacron import __version__; print(__version__)"
          uv run --frozen --extra build python packaging/windows/build_installer.py "--app-version=$candidateVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
      - name: Build standalone sandbox validator
        run: >-
          uv run --frozen --extra build python -m PyInstaller --noconfirm --onefile
          --name datacron-validation --collect-submodules mcp scripts/verify_windows_install.py
      - name: Retain clean-image validation inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-sandbox-inputs
          path: |
            dist/datacron-validation.exe
            dist-installer/Datacron-Setup.exe
      - name: Verify install and reinstall with runtime PATH restricted
        shell: pwsh
        env:
          DATACRON_DISPOSABLE_MACHINE: '1'
        run: |
          $candidateHash = (Get-FileHash -LiteralPath dist-installer/Datacron-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          uv run --frozen python scripts/verify_windows_install.py --allow-install --installer dist-installer/Datacron-Setup.exe --sha256 $candidateHash --report install-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Installer verification failed.' }
      - name: Measure concurrent sessions
        run: uv run --frozen python scripts/benchmark_sessions.py --sizes 100 1000 5000 --clients 3 --repeats 10 > session-evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: runtime-evidence
          path: '*-evidence.json'
